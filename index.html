<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invitación - Celebración</title>
  <!-- Fuente Google: Lora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #8e5fb7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    /* Estructura para embed: sin scrollbars forzadas */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: transparent !important;
      font-family: 'Lora', Georgia, serif;
      color: var(--primary-color);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Contenedor adaptativo: Amplio en Desktop, compacto en Mobile */
    .card-container {
      width: 100%;
      max-width: 600px; /* Tamaño generoso para vista Desktop */
      margin: 0 auto;
      padding: 18px 24px 20px;
      background: transparent;
      border: none;
      box-shadow: none;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      transition: max-width 0.3s ease, padding 0.3s ease;
    }

    /* CAPA DE ESTRELLITAS */
    .stars-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .breathing-star {
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      animation-name: starBreathe;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
      will-change: transform, opacity;
    }

    .breathing-star svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    @keyframes starBreathe {
      0%, 100% {
        transform: scale(0.65) rotate(0deg);
        opacity: 0.35;
        filter: drop-shadow(0 0 2px rgba(142, 95, 183, 0.3));
      }
      50% {
        transform: scale(1.25) rotate(16deg);
        opacity: 1;
        filter: drop-shadow(0 0 8px rgba(232, 172, 188, 0.95)) drop-shadow(0 0 14px rgba(142, 95, 183, 0.8));
      }
    }

    /* CONTENIDO PRINCIPAL */
    .card-content {
      position: relative;
      z-index: 2;
    }

    /* =========================================
       ESTILOS EN DESKTOP (VISTA GRANDE)
       ========================================= */
    .celebracion-svg-wrap {
      width: 100%;
      max-width: 370px; /* Título grande y destacado en PC */
      margin: 6px auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .celebracion-svg-wrap svg {
      width: 100%;
      height: auto;
      max-height: 92px;
      display: block;
      filter: drop-shadow(0 3px 6px rgba(142, 95, 183, 0.18));
    }

    .venue-section {
      margin-bottom: 22px;
    }

    .venue-intro {
      font-size: 19px;
      font-weight: 400;
      color: var(--primary-color);
      letter-spacing: 0.4px;
      margin-bottom: 6px;
      line-height: 1.3;
      opacity: 0.95;
    }

    .venue-name {
      font-size: 27px; /* Bien legible en PC */
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: 0.6px;
      line-height: 1.3;
    }

    .datetime-container {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 440px;
      margin: 0 auto 22px;
      padding: 8px 6px;
    }

    .datetime-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }

    .date-text,
    .time-text {
      font-size: 24px; /* Tamaño parejo e imponente */
      font-weight: 600;
      letter-spacing: 1.4px;
      color: var(--primary-color);
      text-transform: uppercase;
      white-space: nowrap;
      line-height: 1.2;
    }

    .divider-line {
      width: 2px;
      height: 44px;
      background: rgba(142, 95, 183, 0.35);
      border-radius: 2px;
      margin: 0 14px;
      flex-shrink: 0;
    }

    .address-section {
      padding-top: 2px;
    }

    .address-text {
      font-size: 17.5px;
      font-weight: 400;
      line-height: 1.4;
      color: var(--primary-color);
      letter-spacing: 0.3px;
      opacity: 0.95;
    }

    /* Estrellitas un poco más grandes en Desktop */
    @media (min-width: 540px) {
      .breathing-star {
        transform: scale(1.22);
      }
    }

    /* =========================================
       ESTILOS EN MOBILE (SE REDUCE AUTOMÁTICAMENTE
       PARA NO HACER SCROLL EN EL IFRAME DE TALLY)
       ========================================= */
    @media (max-width: 539px) {
      .card-container {
        max-width: 100%;
        padding: 8px 10px 10px;
      }
      .celebracion-svg-wrap {
        max-width: 260px;
        margin: 2px auto 10px;
      }
      .celebracion-svg-wrap svg {
        max-height: 65px;
      }
      .venue-intro {
        font-size: 14.5px;
        margin-bottom: 2px;
      }
      .venue-name {
        font-size: 20px;
      }
      .venue-section {
        margin-bottom: 14px;
      }
      .datetime-container {
        max-width: 330px;
        margin: 0 auto 14px;
        padding: 4px 2px;
      }
      .date-text,
      .time-text {
        font-size: 17px;
        letter-spacing: 0.8px;
      }
      .divider-line {
        height: 32px;
        margin: 0 8px;
      }
      .address-text {
        font-size: 13.5px;
      }
    }

    @media (max-width: 360px) {
      .celebracion-svg-wrap {
        max-width: 230px;
      }
      .date-text,
      .time-text {
        font-size: 15.5px;
        letter-spacing: 0.5px;
      }
      .venue-name {
        font-size: 18.5px;
      }
    }
  </style>
</head>
